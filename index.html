<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>IELTS 學習助手</title>
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#A0522D">
<meta name="description" content="雅思單字、閱讀、聽力一站式學習，含 AI 解析與每日推送">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="IELTS">
<link rel="apple-touch-icon" href="./icon.svg">
<link rel="icon" type="image/svg+xml" href="./icon.svg">
<style>
  :root {
    --bg: #FAF6F0;
    --card: #FFFFFF;
    --primary: #A0522D;
    --primary-light: #C9785A;
    --accent: #C9A961;
    --text: #3E2723;
    --text-light: #7A6258;
    --border: #E8DFD3;
    --success: #6B8E5A;
    --error: #B85450;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Noto Sans TC", "PingFang TC", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    min-height: 100vh;
  }
  header {
    background: var(--primary);
    color: white;
    padding: 20px;
    text-align: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }
  header h1 { font-size: 22px; font-weight: 500; letter-spacing: 1px; }
  header .subtitle { font-size: 13px; opacity: 0.85; margin-top: 4px; }
  nav {
    display: flex;
    background: var(--card);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  nav button {
    flex: 1;
    padding: 16px;
    border: none;
    background: transparent;
    cursor: pointer;
    font-size: 15px;
    color: var(--text-light);
    transition: all 0.2s;
    border-bottom: 3px solid transparent;
    font-family: inherit;
  }
  nav button.active {
    color: var(--primary);
    border-bottom-color: var(--primary);
    font-weight: 600;
  }
  nav button:hover { background: var(--bg); }
  main {
    max-width: 720px;
    margin: 0 auto;
    padding: 24px 16px 60px;
  }
  .module { display: none; }
  .module.active { display: block; }
  .card {
    background: var(--card);
    border-radius: 12px;
    padding: 24px;
    margin-bottom: 16px;
    box-shadow: 0 2px 12px rgba(160,82,45,0.06);
  }
  .stats {
    display: flex;
    gap: 12px;
    margin-bottom: 20px;
  }
  .stat {
    flex: 1;
    background: var(--card);
    padding: 14px;
    border-radius: 10px;
    text-align: center;
    border: 1px solid var(--border);
  }
  .stat-num { font-size: 22px; font-weight: 600; color: var(--primary); }
  .stat-label { font-size: 12px; color: var(--text-light); margin-top: 2px; }

  /* Vocabulary */
  .topic-filter {
    display: flex;
    gap: 6px;
    margin-bottom: 14px;
    overflow-x: auto;
    padding-bottom: 4px;
    -webkit-overflow-scrolling: touch;
  }
  .topic-btn {
    padding: 6px 14px;
    border: 1px solid var(--border);
    background: white;
    border-radius: 16px;
    font-size: 13px;
    cursor: pointer;
    white-space: nowrap;
    color: var(--text-light);
    font-family: inherit;
    transition: all 0.15s;
    flex-shrink: 0;
  }
  .topic-btn:hover { border-color: var(--primary-light); }
  .topic-btn.active {
    background: var(--primary);
    color: white;
    border-color: var(--primary);
  }

  /* Progress page */
  .progress-overview {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 18px;
  }
  .overview-card {
    background: var(--card);
    border-radius: 10px;
    padding: 14px;
    text-align: center;
    border: 1px solid var(--border);
  }
  .overview-num {
    font-size: 26px;
    font-weight: 600;
    color: var(--primary);
  }
  .overview-label {
    font-size: 12px;
    color: var(--text-light);
    margin-top: 2px;
  }
  .section-title {
    font-size: 14px;
    color: var(--primary);
    margin-bottom: 14px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    font-weight: 600;
  }
  .topic-progress-row {
    margin-bottom: 14px;
  }
  .topic-progress-row:last-child { margin-bottom: 0; }
  .topic-progress-header {
    display: flex;
    justify-content: space-between;
    margin-bottom: 6px;
    font-size: 13px;
  }
  .topic-progress-name { color: var(--text); font-weight: 500; }
  .topic-progress-stat { color: var(--text-light); }
  .progress-bar {
    height: 8px;
    background: var(--bg);
    border-radius: 4px;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--primary));
    border-radius: 4px;
    transition: width 0.4s ease;
  }
  .heatmap {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
    margin-top: 8px;
  }
  .heatmap-day {
    aspect-ratio: 1;
    border-radius: 6px;
    background: var(--bg);
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    color: var(--text-light);
  }
  .heatmap-day.lvl-1 { background: rgba(160,82,45,0.15); color: var(--text); }
  .heatmap-day.lvl-2 { background: rgba(160,82,45,0.35); color: var(--text); }
  .heatmap-day.lvl-3 { background: rgba(160,82,45,0.6); color: white; }
  .heatmap-day.lvl-4 { background: var(--primary); color: white; }
  .heatmap-date { font-size: 10px; opacity: 0.85; }
  .heatmap-count { font-size: 13px; font-weight: 600; margin-top: 2px; }
  .score-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
  }
  .score-row:last-child { border-bottom: none; }
  .score-row .title { color: var(--text); }
  .score-row .score {
    font-weight: 600;
    color: var(--success);
  }
  .score-row .score.poor { color: var(--error); }
  .empty-state {
    text-align: center;
    padding: 24px;
    color: var(--text-light);
    font-size: 13px;
  }

  /* Daily plan */
  .daily-plan-card {
    border-left: 4px solid var(--accent);
    background: linear-gradient(135deg, var(--card), rgba(201,169,97,0.06));
  }
  .plan-date {
    font-size: 12px;
    color: var(--text-light);
    margin-bottom: 14px;
  }
  .plan-tier { margin-bottom: 14px; }
  .plan-tier:last-child { margin-bottom: 0; }
  .plan-tier-title {
    font-size: 12px;
    color: var(--text);
    font-weight: 600;
    margin-bottom: 6px;
    letter-spacing: 0.3px;
  }
  .plan-task {
    padding: 10px 12px;
    background: var(--bg);
    border-radius: 7px;
    font-size: 14px;
    color: var(--text);
    margin-bottom: 6px;
    line-height: 1.55;
    display: flex;
    align-items: flex-start;
    gap: 8px;
  }
  .plan-task:last-child { margin-bottom: 0; }
  .plan-task-icon { flex-shrink: 0; font-size: 16px; }
  .plan-task-action {
    margin-left: auto;
    flex-shrink: 0;
    font-size: 11px;
    color: var(--primary);
    background: white;
    padding: 3px 8px;
    border-radius: 10px;
    border: 1px solid var(--border);
    cursor: pointer;
    align-self: center;
  }
  .plan-task-action:hover { background: var(--primary); color: white; border-color: var(--primary); }
  .plan-footer {
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
    font-size: 13px;
    color: var(--text-light);
    text-align: center;
  }
  .plan-encouragement {
    margin-top: 8px;
    padding: 10px 14px;
    background: rgba(107,142,90,0.1);
    color: var(--success);
    border-radius: 6px;
    font-size: 13px;
    text-align: center;
  }
  .hint {
    text-align: center;
    color: var(--text-light);
    font-size: 13px;
    margin-top: 12px;
  }
  .actions {
    display: flex;
    gap: 10px;
    margin-top: 16px;
  }
  .btn {
    flex: 1;
    padding: 14px;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
    font-weight: 500;
  }
  .btn-primary { background: var(--primary); color: white; }
  .btn-primary:hover { background: #8B4513; }
  .btn-success { background: var(--success); color: white; }
  .btn-error { background: var(--error); color: white; }
  .btn-secondary {
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
  }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* Settings & Modal */
  header { position: relative; }
  .settings-btn {
    position: absolute;
    top: 16px;
    right: 16px;
    background: rgba(255,255,255,0.2);
    border: none;
    color: white;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 18px;
    transition: background 0.2s;
  }
  .settings-btn:hover { background: rgba(255,255,255,0.3); }
  .modal-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.5);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 16px;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: var(--card);
    border-radius: 16px;
    max-width: 480px;
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
  }
  .modal-header {
    padding: 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .modal-header h2 { font-size: 18px; color: var(--primary); }
  .close-btn {
    background: none;
    border: none;
    font-size: 22px;
    cursor: pointer;
    color: var(--text-light);
    padding: 0 6px;
  }
  .modal-body { padding: 20px; }
  .setting-section { margin-bottom: 24px; }
  .setting-section h3 {
    font-size: 14px;
    color: var(--primary);
    margin-bottom: 12px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .setting-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 0;
    gap: 12px;
  }
  .setting-row.vertical {
    flex-direction: column;
    align-items: stretch;
    gap: 8px;
  }
  .setting-row input[type="time"],
  .setting-row input[type="password"],
  .setting-row input[type="text"] {
    padding: 9px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-family: inherit;
    font-size: 14px;
    background: white;
  }
  .setting-row input[type="checkbox"] {
    width: 18px;
    height: 18px;
    accent-color: var(--primary);
  }
  .setting-note {
    font-size: 12px;
    color: var(--text-light);
    margin-top: 8px;
    line-height: 1.7;
    padding: 10px 12px;
    background: var(--bg);
    border-radius: 6px;
  }
  .setting-note a { color: var(--primary); text-decoration: none; }
  .setting-note a:hover { text-decoration: underline; }

  /* Streak banner */
  .streak-banner {
    background: linear-gradient(135deg, #C9A961, #A0522D);
    color: white;
    padding: 14px 18px;
    border-radius: 12px;
    margin-bottom: 16px;
    display: none;
    align-items: center;
    gap: 14px;
    box-shadow: 0 4px 12px rgba(160,82,45,0.15);
  }
  .streak-banner.show { display: flex; }
  .streak-fire { font-size: 28px; }
  .streak-text { font-size: 14px; }
  .streak-text strong { font-size: 18px; }
</style>
<link rel="stylesheet" href="./css/vocab.css">
</head>
<body>

<header>
  <h1>🪷 IELTS 學習助手</h1>
  <div class="subtitle">Vocabulary · SRS · Spelling · Production</div>
  <button class="settings-btn" onclick="openSettings()" title="設定">⚙️</button>
</header>

<nav>
  <button class="tab-btn active" data-tab="vocab">📚 單字</button>
  <button class="tab-btn" data-tab="progress">📊 進度</button>
</nav>

<main>
  <div class="streak-banner" id="streak-banner">
    <span class="streak-fire">🔥</span>
    <div class="streak-text">連續學習 <strong id="streak-num">0</strong> 天</div>
  </div>

  <!-- 單字模組：五種學習模式，內容由 js/vocab.js 渲染 -->
  <section class="module active" id="vocab">
    <div id="vocab-home"></div>
    <div id="vocab-stage" style="display:none;"></div>
  </section>

  <!-- 進度模組 -->
  <section class="module" id="progress">
    <div class="card daily-plan-card">
      <div class="section-title">📋 今日學習計畫</div>
      <div class="plan-date" id="plan-date"></div>
      <div id="daily-plan"></div>
    </div>

    <div class="progress-overview">
      <div class="overview-card"><div class="overview-num" id="ov-known">0</div><div class="overview-label">✓ 認識</div></div>
      <div class="overview-card"><div class="overview-num" id="ov-learning">0</div><div class="overview-label">⟳ 複習中</div></div>
      <div class="overview-card"><div class="overview-num" id="ov-untouched">0</div><div class="overview-label">▢ 未學</div></div>
    </div>

    <div class="card">
      <div class="section-title">各主題進度</div>
      <div id="topic-progress"></div>
    </div>

    <div id="vocab-dashboard"></div>

    <div class="card">
      <div class="section-title">近 7 天活動</div>
      <div class="heatmap" id="heatmap"></div>
      <div style="font-size:12px;color:var(--text-light);margin-top:10px;text-align:center;">
        數字 = 當天完成的練習次數
      </div>
    </div>
  </section>

</main>

<!-- 設定 Modal -->
<div class="modal-overlay" id="settings-modal" onclick="closeSettings(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-header">
      <h2>⚙️ 設定</h2>
      <button class="close-btn" onclick="closeSettings()">✕</button>
    </div>
    <div class="modal-body">
      <div class="setting-section">
        <h3>🔔 每日提醒</h3>
        <div class="setting-row">
          <span>開啟每日推送</span>
          <input type="checkbox" id="notif-enabled" onchange="toggleNotification()">
        </div>
        <div class="setting-row">
          <span>提醒時間</span>
          <input type="time" id="notif-time" value="08:00" onchange="saveSettings()">
        </div>
        <div class="setting-note" id="notif-status">
          開啟後，瀏覽器會在指定時間提醒你來練習。<br>
          📌 注意：頁面需保持開啟（可置於背景分頁）才能收到提醒。
        </div>
      </div>

      <div class="setting-section" id="speech-section">
        <h3>🔊 發音</h3>
        <div class="setting-row">
          <span>口音</span>
          <select id="speech-accent" onchange="saveSpeechSettings()">
            <option value="en-GB">英式</option>
            <option value="en-US">美式</option>
          </select>
        </div>
        <div class="setting-row">
          <span>語速 <span id="speech-rate-label">0.9×</span></span>
          <input type="range" id="speech-rate" min="0.6" max="1.2" step="0.1"
                 oninput="saveSpeechSettings()">
        </div>
        <div class="setting-row">
          <span>翻面時自動念例句</span>
          <input type="checkbox" id="speech-auto" onchange="saveSpeechSettings()">
        </div>
        <button class="btn btn-secondary" onclick="testSpeech()" style="margin-top:4px;">🔊 試聽</button>
        <div class="setting-note" id="speech-status">
          用手機／電腦系統內建的語音，不下載音檔、不連外部服務，離線也能念。
        </div>
      </div>

      <div class="setting-section">
        <h3>📊 學習數據</h3>
        <div class="setting-note">
          🔥 連續學習：<strong id="stat-streak">0</strong> 天<br>
          📅 上次學習：<span id="stat-last">尚未開始</span>
        </div>
        <button class="btn btn-secondary" onclick="resetAllData()" style="margin-top:12px;">重置所有資料</button>
      </div>
    </div>
  </div>
</div>

<script src="./js/srs.js"></script>
<script src="./js/textutil.js"></script>
<script src="./js/speech.js"></script>
<script src="./js/cards.js"></script>
<script src="./js/legacy-words.js"></script>
<script src="./js/store.js"></script>
<script src="./js/dashboard.js"></script>
<script src="./js/vocab.js"></script>
<script src="./js/app.js"></script>
</body>
</html>
